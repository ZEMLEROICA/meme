<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 МЕМНЫЙ КЕЙС 228 (GITHUB API) 🔥</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0000);
            background-size: 400% 400%;
            animation: rainbowBg 5s ease infinite;
            font-family: 'Impact', sans-serif;
            color: #fff;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            text-align: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes rainbowBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blink { animation: blinker 0.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .shake { animation: shake 0.3s infinite; }
        @keyframes shake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            10% { transform: translate(-3px, -4px) rotate(-2deg); }
            30% { transform: translate(-5px, 0px) rotate(2deg); }
            50% { transform: translate(3px, 4px) rotate(-2deg); }
            70% { transform: translate(5px, 2px) rotate(0deg); }
            100% { transform: translate(3px, -4px) rotate(-2deg); }
        }

        h1 { font-size: 3rem; color: #ffff00; margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* Таймер */
        #timer-box {
            background: rgba(0, 0, 0, 0.85);
            border: 5px dashed #00ff00;
            padding: 15px;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        /* Рулетка */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: #111;
            border: 8px solid #ff0055;
            box-shadow: 0 0 30px #ff0055;
            overflow: hidden;
            margin: 20px 0;
            border-radius: 10px;
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 100%;
            background: #ffff00;
            box-shadow: 0 0 15px #ffff00;
            z-index: 10;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            height: 180px;
            transition: transform 5s cubic-bezier(0.15, 0.9, 0.2, 1);
        }

        .meme-card {
            width: 160px;
            height: 180px;
            margin: 0 5px;
            background: #222;
            border: 4px solid #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
            border-radius: 8px;
        }

        .meme-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .meme-card .title { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        /* Редкости */
        .rarity-common { border-color: #b0c3d9; background: #2e353d; }
        .rarity-rare { border-color: #4b69ff; background: #1a2347; }
        .rarity-epic { border-color: #d32ce6; background: #4a154b; }
        .rarity-legendary { border-color: #eb4b4b; background: #521a1a; }
        .rarity-god { border-color: #ffd700; background: #5e4d00; animation: blinker 0.2s infinite; }

        /* Кнопки */
        .btn {
            background: #ff0055;
            color: #fff;
            font-family: 'Impact', sans-serif;
            font-size: 1.8rem;
            padding: 15px 30px;
            border: 4px solid #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #000;
            border-radius: 10px;
            margin: 10px;
        }
        .btn:hover { background: #00ffcc; color: #000; transform: scale(1.05); }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Инвентарь */
        .collection {
            background: rgba(0, 0, 0, 0.85);
            border: 5px solid #00ffff;
            padding: 20px;
            margin-top: 30px;
            border-radius: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .inventory-item {
            position: relative;
            background: #222;
            border: 3px solid #fff;
            padding: 5px;
            border-radius: 8px;
        }
        .inventory-item img { width: 100%; height: 100px; object-fit: cover; }
        .inventory-item .count {
            position: absolute; top: 2px; right: 2px; background: #ff0000;
            padding: 2px 6px; font-size: 0.8rem; border-radius: 10px;
        }

        /* Админка */
        .admin-panel {
            display: none;
            background: rgba(0, 0, 0, 0.95);
            border: 5px solid #ff0000;
            padding: 20px;
            margin-top: 30px;
            border-radius: 15px;
            text-align: left;
        }
        .admin-panel input, .admin-panel select {
            width: 100%; padding: 10px; margin: 8px 0; font-family: sans-serif; font-size: 1rem;
        }

        .admin-meme-list {
            max-height: 250px;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border: 2px solid #555;
            margin-top: 10px;
            border-radius: 8px;
        }

        .admin-meme-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
        .admin-meme-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }

        .btn-delete {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 5px 12px;
            cursor: pointer;
            font-family: sans-serif;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-delete:hover { background: #cc0000; }

        /* Модалка выигрыша & СУПЕР ТРЕШ-ЭФФЕКТЫ */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center;
            flex-direction: column; overflow: hidden;
        }

        /* Диско-стробоскоп при победе */
        @keyframes discoFlash {
            0% { background: rgba(255, 0, 0, 0.95); }
            20% { background: rgba(0, 255, 0, 0.95); }
            40% { background: rgba(0, 0, 255, 0.95); }
            60% { background: rgba(255, 255, 0, 0.95); }
            80% { background: rgba(255, 0, 255, 0.95); }
            100% { background: rgba(0, 255, 255, 0.95); }
        }

        .trash-win-active {
            animation: discoFlash 0.06s infinite, shake 0.1s infinite !important;
        }

        @keyframes crazySpin {
            0% { transform: scale(0.2) rotate(0deg); }
            50% { transform: scale(1.4) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        .win-img-crazy {
            animation: crazySpin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), shake 0.08s infinite !important;
            box-shadow: 0 0 50px #fff, 0 0 100px #ff0055, 0 0 150px #00ff00 !important;
            border: 8px solid #ffff00 !important;
        }

        /* Летающие частицы */
        .trash-particle {
            position: fixed;
            font-size: 3.5rem;
            pointer-events: none;
            z-index: 101;
            animation: particleFly 1s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(2) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="shake">💥 МЕМНЫЙ КЕЙСИКОДРОМ 228 💥</h1>
    
    <div id="timer-box">
        ДО СЛЕДУЮЩЕЙ ПРОКРУТКИ: <span id="timer" class="blink" style="color: #00ff00;">00:00</span>
    </div>

    <!-- Рулетка -->
    <div class="roulette-wrapper">
        <div class="pointer"></div>
        <div class="roulette-track" id="track"></div>
    </div>

    <button id="open-btn" class="btn shake" onclick="spin()">КРУТИТЬ КЕЙС</button>
    <button class="btn" style="background:#7a00ff;" onclick="toggleAdmin()">АДМИНКА</button>

    <!-- Инвентарь -->
    <div class="collection">
        <h2>🏆 ТВОЯ ТРЕШ-КОЛЛЕКЦИЯ 🏆</h2>
        <div class="grid" id="inventory"></div>
    </div>

    <!-- Админ Панель -->
    <div class="admin-panel" id="adminPanel">
        <h2 style="color: #ff0000; text-align: center;">⚙️ АДМИН ПАНЕЛЬ (GITHUB API) ⚙️</h2>
        
        <div style="background: #222; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <h4 style="color: #00ff00;">1. Настройки GitHub (Вводится 1 раз):</h4>
            <label>Репозиторий (Логин/Имя):</label>
            <input type="text" id="ghRepo" placeholder="например: ivan/meme-case">
            <label>GitHub Personal Access Token:</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn" style="font-size: 1rem; padding: 5px 15px; background: #555;" onclick="saveCredentials()">Запомнить ключи</button>
        </div>

        <h4 style="color: #ffff00;">2. Добавить новый мем:</h4>
        <label>Название мема:</label>
        <input type="text" id="memeName" placeholder="Например: Повар спрашивает повара">
        
        <label>Загрузить картинку:</label>
        <input type="file" id="memeFile" accept="image/*">
        
        <label style="color: #00ffff; font-weight: bold;">🔊 Загрузить кастомный звук мема (MP3 / WAV):</label>
        <input type="file" id="memeAudio" accept="audio/*">

        <label>Редкость:</label>
        <select id="memeRarity">
            <option value="common">Обычный (Серый)</option>
            <option value="rare">Редкий (Синий)</option>
            <option value="epic">Эпический (Фиолетовый)</option>
            <option value="legendary">Легендарный (Красный)</option>
            <option value="god">МЕМНЫЙ БОГ (Золотой)</option>
        </select>

        <label>Шанс выпадения (Вес):</label>
        <input type="number" id="memeChance" value="10">

        <button id="add-btn" class="btn" style="width: 100%; margin: 15px 0; background: #00aa00;" onclick="addAndPublishMeme()">🚀 ОПУБЛИКОВАТЬ МЕМ НА GITHUB</button>

        <hr style="border-color: #444; margin: 20px 0;">

        <h4 style="color: #ff5555;">3. Управление и удаление текущих мемов:</h4>
        <div class="admin-meme-list" id="adminMemeList">
            <!-- Список мемов загрузится сюда -->
        </div>
    </div>
</div>

<!-- Модалка Выигрыша -->
<div class="modal" id="winModal">
    <h1 class="blink" style="color: #ffff00; font-size: 4rem; text-shadow: 5px 5px 0 #ff0000;">💥 СВЕРХРАЗРЫВ! 💥</h1>
    <h2 id="winName" style="font-size: 3rem; color: #00ff00;"></h2>
    <img id="winImg" src="" alt="Winner" style="max-width: 320px; max-height: 320px; border-radius: 10px;">
    <button class="btn shake" style="font-size: 2rem; background: #00ff00; color: #000;" onclick="closeModal()">ЗАБРАТЬ В ИНВЕНТАРЬ</button>
</div>

<script>
    let memesList = [];
    let myInventory = JSON.parse(localStorage.getItem('myMemeInventory') || '{}');
    let lastSpinTime = localStorage.getItem('lastSpinTime') || 0;
    let isSpinning = false;
    let currentAudioTrack = null;

    document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || '';
    document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';

    function saveCredentials() {
        localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
        localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
        alert("Ключи сохранены!");
    }

    // --- 1. ЗАГРУЗКА БАЗЫ ДАННЫХ ИЗ JSON ---
    async function loadMemesJSON() {
        try {
            const response = await fetch('memes.json?t=' + Date.now());
            memesList = await response.json();
            renderInventory();
            renderAdminMemeList();
        } catch (e) {
            console.error("Ошибка загрузки memes.json.");
        }
    }
    loadMemesJSON();

    // --- 2. ЗВУКОВЫЕ ЭФФЕКТЫ ДВИЖКА ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type='sine') {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    // Синтез безумного треш-звука (если нет кастомного аудофайла)
    function playCrazyWinSynth() {
        let step = 0;
        const interval = setInterval(() => {
            playSound(150 + Math.random() * 1200, 0.08, 'sawtooth');
            step++;
            if (step > 35) clearInterval(interval);
        }, 60);
    }

    // --- 3. ТАЙМЕР (30 минут) ---
    const SPIN_COOLDOWN = 30 * 60 * 1000;

    function updateTimer() {
        const now = Date.now();
        const diff = SPIN_COOLDOWN - (now - lastSpinTime);
        const btn = document.getElementById('open-btn');
        const timerEl = document.getElementById('timer');

        if (diff <= 0) {
            timerEl.innerText = "ГОТОВО!";
            timerEl.style.color = "#00ff00";
            if (!isSpinning) btn.disabled = false;
        } else {
            btn.disabled = true;
            const m = Math.floor(diff / 1000 / 60);
            const s = Math.floor((diff / 1000) % 60);
            timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            timerEl.style.color = "#ff0000";
        }
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // --- 4. РУЛЕТКА И БЕЗУМНЫЕ ЭФФЕКТЫ ---
    function getRandomMeme() {
        let totalWeight = memesList.reduce((acc, m) => acc + Number(m.chance), 0);
        let random = Math.random() * totalWeight;
        for (let meme of memesList) {
            if (random < meme.chance) return meme;
            random -= meme.chance;
        }
        return memesList[0];
    }

    function createCardHTML(meme) {
        return `
            <div class="meme-card rarity-${meme.rarity}">
                <img src="${meme.img}" alt="${meme.name}">
                <div class="title">${meme.name}</div>
            </div>
        `;
    }

    function spin() {
        if (isSpinning || memesList.length === 0) return;
        
        isSpinning = true;
        document.getElementById('open-btn').disabled = true;
        
        const track = document.getElementById('track');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0)';

        let tape = [];
        for (let i = 0; i < 40; i++) {
            tape.push(getRandomMeme());
        }

        const winningMeme = getRandomMeme();
        tape[35] = winningMeme;

        track.innerHTML = tape.map(m => createCardHTML(m)).join('');

        const cardWidth = 170;
        const targetOffset = (35 * cardWidth) - (document.querySelector('.roulette-wrapper').offsetWidth / 2) + (cardWidth / 2);

        let tickCount = 0;
        const tickInterval = setInterval(() => {
            tickCount++;
            playSound(300 + (tickCount * 12), 0.05, 'sawtooth');
            if(tickCount > 30) clearInterval(tickInterval);
        }, 150);

        setTimeout(() => {
            track.style.transition = 'transform 5s cubic-bezier(0.1, 0.9, 0.1, 1)';
            track.style.transform = `translateX(-${targetOffset}px)`;
        }, 50);

        setTimeout(() => {
            isSpinning = false;
            lastSpinTime = Date.now();
            localStorage.setItem('lastSpinTime', lastSpinTime);
            
            myInventory[winningMeme.name] = (myInventory[winningMeme.name] || 0) + 1;
            localStorage.setItem('myMemeInventory', JSON.stringify(myInventory));
            renderInventory();

            // ПОКАЗЫВАЕМ ПОБЕДУ С ТРЕШ-ЭФФЕКТАМИ
            showWinEffects(winningMeme);
            updateTimer();
        }, 5200);
    }

    function showWinEffects(meme) {
        const modal = document.getElementById('winModal');
        const winImg = document.getElementById('winImg');

        document.getElementById('winName').innerText = meme.name;
        winImg.src = meme.img;

        // Включаем супер-стробоскоп и анимацию
        modal.classList.add('trash-win-active');
        winImg.classList.add('win-img-crazy');
        modal.style.display = 'flex';

        // Спавним летающие треш-эмодзи
        spawnTrashParticles();

        // Проигрываем звук: Кастомный аудио-файл или Синтезатор Хаоса
        if (meme.audio) {
            try {
                if (currentAudioTrack) currentAudioTrack.pause();
                currentAudioTrack = new Audio(meme.audio);
                currentAudioTrack.play().catch(e => playCrazyWinSynth());
            } catch(e) {
                playCrazyWinSynth();
            }
        } else {
            playCrazyWinSynth();
        }
    }

    function spawnTrashParticles() {
        const emojis = ['🔥', '💥', '😱', '🗿', '👑', '💯', '🎉', '⚡', '🤡', '💩', '🍌', '🚀'];
        for (let i = 0; i < 45; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'trash-particle';
                p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = (Math.random() * 90 + 5) + 'vw';
                p.style.top = (Math.random() * 90 + 5) + 'vh';
                
                const dx = (Math.random() * 800 - 400) + 'px';
                const dy = (Math.random() * 800 - 400) + 'px';
                p.style.setProperty('--dx', dx);
                p.style.setProperty('--dy', dy);

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }, i * 40);
        }
    }

    function closeModal() {
        const modal = document.getElementById('winModal');
        const winImg = document.getElementById('winImg');
        
        modal.style.display = 'none';
        modal.classList.remove('trash-win-active');
        winImg.classList.remove('win-img-crazy');

        if (currentAudioTrack) {
            currentAudioTrack.pause();
            currentAudioTrack = null;
        }
    }

    function renderInventory() {
        const invEl = document.getElementById('inventory');
        invEl.innerHTML = '';
        
        for (let name in myInventory) {
            const meme = memesList.find(m => m.name === name) || { img: '', rarity: 'common' };
            invEl.innerHTML += `
                <div class="inventory-item rarity-${meme.rarity}">
                    <div class="count">x${myInventory[name]}</div>
                    <img src="${meme.img}">
                    <div style="font-size:0.8rem; overflow:hidden;">${name}</div>
                </div>
            `;
        }
    }

    // --- 5. АДМИНКА + УДАЛЕНИЕ + ЗАГРУЗКА ЗВУКА И КАРТИНКИ ---
    function toggleAdmin() {
        const panel = document.getElementById('adminPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            const pass = prompt("ПАРОЛЬ АДМИНА:");
            if (pass === "1002") {
                panel.style.display = 'block';
                renderAdminMemeList();
            } else {
                alert("НЕВЕРНЫЙ ПАРОЛЬ!");
            }
        }
    }

    function renderAdminMemeList() {
        const listEl = document.getElementById('adminMemeList');
        if (memesList.length === 0) {
            listEl.innerHTML = '<div style="color:#aaa;">В базе пока нет мемов.</div>';
            return;
        }

        listEl.innerHTML = memesList.map((m, index) => `
            <div class="admin-meme-item">
                <img src="${m.img}" alt="${m.name}">
                <span style="font-size: 0.9rem; margin-left: 10px; flex-grow: 1; text-align: left;">
                    ${m.name} (${m.rarity}) ${m.audio ? '🔊' : ''}
                </span>
                <button class="btn-delete" onclick="deleteMeme(${index})">🗑️ Удалить</button>
            </div>
        `).join('');
    }

    async function pushListToGitHub(commitMsg) {
        const repo = document.getElementById('ghRepo').value.trim();
        const token = document.getElementById('ghToken').value.trim();

        if (!repo || !token) {
            alert("Заполните имя репозитория и GitHub Токен!");
            return false;
        }

        saveCredentials();

        try {
            const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/memes.json`, {
                headers: { 'Authorization': `token ${token}` }
            });
            
            let sha = "";
            if (getRes.ok) {
                const getData = await getRes.json();
                sha = getData.sha;
            }

            const jsonString = JSON.stringify(memesList, null, 2);
            const bytes = new TextEncoder().encode(jsonString);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const contentBase64 = btoa(binary);

            const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/memes.json`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: commitMsg,
                    content: contentBase64,
                    sha: sha || undefined
                })
            });

            return putRes.ok;
        } catch (err) {
            console.error(err);
            return false;
        }
    }

    async function deleteMeme(index) {
        if (!confirm(`Точно удалить мем "${memesList[index].name}"?`)) return;

        const deletedName = memesList[index].name;
        memesList.splice(index, 1);
        renderAdminMemeList();

        const success = await pushListToGitHub(`Удален мем: ${deletedName}`);
        if (success) {
            alert(`Мем "${deletedName}" успешно удален с GitHub!`);
        } else {
            alert("Ошибка при сохранении изменений на GitHub.");
        }
    }

    // Вспомогательная функция чтения файлов в Base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) resolve(null);
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function addAndPublishMeme() {
        const name = document.getElementById('memeName').value.trim();
        const fileInput = document.getElementById('memeFile');
        const audioInput = document.getElementById('memeAudio');
        const rarity = document.getElementById('memeRarity').value;
        const chance = document.getElementById('memeChance').value;

        if (!name || !fileInput.files[0]) {
            alert("Заполните название мема и выберите файл картинки!");
            return;
        }

        const addBtn = document.getElementById('add-btn');
        addBtn.disabled = true;
        addBtn.innerText = "⏳ ЗАГРУЗКА И ПУБЛИКАЦИЯ...";

        try {
            const base64Img = await fileToBase64(fileInput.files[0]);
            const base64Audio = await fileToBase64(audioInput.files[0]);

            const newMeme = {
                id: Date.now(),
                name: name,
                img: base64Img,
                audio: base64Audio, // Сохраняем Base64 аудио или null
                rarity: rarity,
                chance: Number(chance)
            };

            memesList.push(newMeme);

            const success = await pushListToGitHub(`Добавлен мем: ${name}`);

            if (success) {
                alert("🎉 Мем со звуком успешно опубликован на GitHub!");
                document.getElementById('memeName').value = '';
                document.getElementById('memeFile').value = '';
                document.getElementById('memeAudio').value = '';
                renderAdminMemeList();
            } else {
                alert("Ошибка при сохранении мема на GitHub.");
            }
        } catch (err) {
            console.error(err);
            alert("Ошибка обработки файлов!");
        }

        addBtn.disabled = false;
        addBtn.innerText = "🚀 ОПУБЛИКОВАТЬ МЕМ НА GITHUB";
    }
</script>
